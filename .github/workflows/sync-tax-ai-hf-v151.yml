name: Sync Tax AI HF V1.5.1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-tax-ai-hf-v151.yml'

permissions:
  contents: write

jobs:
  deploy-v151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: python -m pip install --upgrade 'huggingface_hub>=0.35' requests
      - name: Upload and verify V1.5.1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,requests
          from pathlib import Path
          from huggingface_hub import HfApi
          repo='AlexandrosLee/tax-ai-zerogpu';base='https://alexandroslee-tax-ai-zerogpu.hf.space';token=os.environ['HF_TOKEN'];api=HfApi(token=token)
          commit=api.upload_folder(folder_path='hf-space-tax-ai',repo_id=repo,repo_type='space',commit_message='Deploy V1.5.1 dedicated tax-category API')
          try: api.wait_for_space(repo_id=repo,timeout=1200)
          except Exception as e: print('wait:',repr(e))
          headers={'Authorization':'Bearer '+token}
          info=requests.get(base+'/gradio_api/info',headers=headers,timeout=60);apis=list((info.json().get('named_endpoints') or {}).keys()) if info.ok else []
          s=requests.post(base+'/gradio_api/call/health_api',headers={**headers,'Content-Type':'application/json'},json={'data':['health']},timeout=60);s.raise_for_status();eid=s.json()['event_id']
          g=requests.get(base+f'/gradio_api/call/health_api/{eid}',headers=headers,timeout=120);g.raise_for_status();health=None
          for line in g.text.splitlines():
              if line.startswith('data:'):
                  try:
                      x=json.loads(line[5:].strip())
                      if isinstance(x,list) and x: health=x[0]
                  except Exception: pass
          actual=(health or {}).get('backend_version');ded=(health or {}).get('dedicated_tax_category_api') is True
          out={'repo_id':repo,'space_url':base,'uploaded':True,'commit':str(commit),'started_at_unix':int(time.time()),'expected_backend_version':'1.5.1','actual_backend_version':actual,'stage':str(api.get_space_runtime(repo_id=repo).stage),'hardware':str(api.get_space_runtime(repo_id=repo).hardware),'api_names':apis,'health':health,'verified':actual=='1.5.1' and ded and '/tax_category_api' in apis}
          Path('tax-ai-v1/hf-space-sync.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['verified']: raise RuntimeError('V1.5.1 contract not ready')
          PY
      - name: Commit verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space-sync.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify ZeroGPU V1.5.1 deployment'
            git push origin HEAD:gh-pages
          fi
