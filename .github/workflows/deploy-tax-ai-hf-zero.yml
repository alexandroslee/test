name: Deploy Tax AI to Hugging Face ZeroGPU

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-tax-ai-hf-zero.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Space source from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Verify Hugging Face deployment credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing repository secret HF_TOKEN. Add a Hugging Face write token as GitHub Actions secret HF_TOKEN, then re-run this workflow."
            exit 2
          fi

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade 'huggingface_hub>=0.35' requests

      - name: Create/update ZeroGPU Space and upload application
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          me = api.whoami()
          owner = me.get('name') or me.get('fullname')
          if not owner:
              raise RuntimeError(f'Cannot determine Hugging Face username from token: {me}')

          repo_id = f'{owner}/tax-ai-zerogpu'
          print('HF account:', owner)
          print('Space:', repo_id)

          api.create_repo(
              repo_id=repo_id,
              repo_type='space',
              space_sdk='gradio',
              exist_ok=True,
              private=False,
          )

          # ZeroGPU still uses the legacy hardware identifier zero-a10g in Hub APIs.
          runtime = api.request_space_hardware(repo_id=repo_id, hardware='zero-a10g')
          print('Requested hardware:', runtime.requested_hardware)

          api.upload_folder(
              folder_path='hf-space-tax-ai',
              repo_id=repo_id,
              repo_type='space',
              commit_message='Deploy Tax AI Gemma 4 E4B ZeroGPU',
          )

          # Re-read runtime after upload. Build can continue asynchronously.
          runtime = api.get_space_runtime(repo_id=repo_id)
          owner_slug = owner.lower().replace('_', '-')
          space_url = f'https://{owner_slug}-tax-ai-zerogpu.hf.space'
          repo_url = f'https://huggingface.co/spaces/{repo_id}'
          config = {
              'configured': True,
              'repo_id': repo_id,
              'repo_url': repo_url,
              'space_url': space_url,
              'stage': str(runtime.stage),
              'hardware': str(runtime.hardware) if runtime.hardware else None,
              'requested_hardware': str(runtime.requested_hardware) if runtime.requested_hardware else 'zero-a10g',
              'deployed_at_unix': int(time.time()),
          }
          Path('tax-ai-v1/hf-space.json').write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

      - name: Commit resolved Space URL back to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space.json
          if git diff --cached --quiet; then
            echo 'Space config unchanged.'
          else
            git commit -m 'Update deployed Hugging Face ZeroGPU endpoint'
            git push origin HEAD:gh-pages
          fi

      - name: Wait for Space startup and test API schema
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from huggingface_hub import HfApi

          cfg = json.load(open('tax-ai-v1/hf-space.json', encoding='utf-8'))
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = cfg['repo_id']
          print('Waiting for:', repo_id)
          try:
              api.wait_for_space(repo_id=repo_id, timeout=1200)
          except Exception as e:
              print('wait_for_space:', repr(e))

          base = cfg['space_url'].rstrip('/')
          # Gradio schema endpoint is CPU-only and proves that the named API routes exist.
          r = requests.get(base + '/gradio_api/openapi.json', timeout=60)
          print('OpenAPI HTTP', r.status_code)
          if r.status_code != 200:
              raise RuntimeError(f'Space OpenAPI unavailable: HTTP {r.status_code}: {r.text[:500]}')
          text = r.text
          for required in ('health_api', 'invoice_api', 'buyer_ban_api'):
              if required not in text:
                  raise RuntimeError(f'Missing Gradio API endpoint: {required}')
          print('SUCCESS: ZeroGPU Space is online and all Tax AI API routes are published.')
          PY
