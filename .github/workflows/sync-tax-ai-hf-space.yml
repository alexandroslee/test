# Force deploy 2026-08-24 V1.5.2 release contract
name: Sync Tax AI ZeroGPU Space

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-tax-ai-hf-space.yml'
  issues:
    types: [opened]

concurrency:
  group: tax-ai-zero-deploy
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[tax-ai-deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: python -m pip install --upgrade 'huggingface_hub>=1.5.0' requests
      - name: Upload, factory rebuild, poll immutable release contract
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          EXPECTED='1.5.2'
          RELEASE_ID='tax-ai-1.5.2-20260822-1555'
          repo_id='AlexandrosLee/tax-ai-zerogpu'
          base='https://alexandroslee-tax-ai-zerogpu.hf.space'
          token=os.environ['HF_TOKEN']
          headers={'Authorization':'Bearer '+token}
          api=HfApi(token=token)

          commit=api.upload_folder(folder_path='hf-space-tax-ai',repo_id=repo_id,repo_type='space',commit_message=f'V{EXPECTED}: release {RELEASE_ID}')
          out={'repo_id':repo_id,'space_url':base,'uploaded':True,'commit':str(commit),'started_at_unix':int(time.time()),'expected_backend_version':EXPECTED,'expected_release_id':RELEASE_ID,'factory_reboot':True,'trigger':os.getenv('GITHUB_EVENT_NAME','unknown')}

          remote_ok=False
          for i in range(24):
              try:
                  p=hf_hub_download(repo_id=repo_id,repo_type='space',filename='app.py',token=token,force_download=True)
                  txt=Path(p).read_text(encoding='utf-8')
                  info=api.repo_info(repo_id=repo_id,repo_type='space')
                  out['hub_revision']=getattr(info,'sha',None)
                  out['hub_app_has_release']=RELEASE_ID in txt and f'BACKEND_VERSION = "{EXPECTED}"' in txt
                  if out['hub_app_has_release']:
                      remote_ok=True
                      break
              except Exception as e:
                  out['hub_source_probe_error']=repr(e)
              time.sleep(5)
          if not remote_ok:
              Path('tax-ai-v1/hf-space-sync.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              raise RuntimeError('HF repo source never converged to V1.5.2')

          api.restart_space(repo_id=repo_id,factory_reboot=True)
          out['restart_requested_at_unix']=int(time.time())

          probes=[]; health=None; api_names=[]
          for attempt in range(120):
              probe={'attempt':attempt+1,'unix':int(time.time())}
              try:
                  rt=api.get_space_runtime(repo_id=repo_id);probe['stage']=str(rt.stage);probe['hardware']=str(rt.hardware) if rt.hardware else None
              except Exception as e: probe['runtime_error']=repr(e)
              try:
                  r=requests.get(base+'/gradio_api/info',headers=headers,timeout=30);probe['info_http']=r.status_code
                  if r.ok:
                      api_names=[k for k in (r.json().get('named_endpoints') or {}).keys()];probe['has_tax_category_api']='/tax_category_api' in api_names
              except Exception as e: probe['info_error']=repr(e)
              try:
                  s=requests.post(base+'/gradio_api/call/health_api',headers={**headers,'Content-Type':'application/json'},json={'data':['health']},timeout=30);probe['health_submit_http']=s.status_code
                  if s.ok and s.json().get('event_id'):
                      eid=s.json()['event_id'];g=requests.get(base+f'/gradio_api/call/health_api/{eid}',headers=headers,timeout=60);probe['health_result_http']=g.status_code
                      if g.ok:
                          last=None
                          for line in g.text.splitlines():
                              if line.startswith('data:'):
                                  try:
                                      x=json.loads(line[5:].strip());
                                      if isinstance(x,list) and x:last=x[0]
                                  except Exception:pass
                          health=last
                          if isinstance(last,dict):probe['backend_version']=last.get('backend_version') or last.get('version');probe['release_id']=last.get('release_id')
              except Exception as e: probe['health_error']=repr(e)
              probes.append(probe)
              if len(probes)>12: probes=probes[-12:]
              if isinstance(health,dict) and health.get('backend_version')==EXPECTED and health.get('release_id')==RELEASE_ID and health.get('dedicated_tax_category_api') is True and '/tax_category_api' in api_names: break
              time.sleep(5)

          out['last_probes']=probes;out['api_names']=api_names;out['health']=health
          actual=(health or {}).get('backend_version') if isinstance(health,dict) else None;release=(health or {}).get('release_id') if isinstance(health,dict) else None
          out['actual_backend_version']=actual;out['actual_release_id']=release;out['tax_category_supported']=(health or {}).get('tax_category_supported') if isinstance(health,dict) else None;out['dedicated_tax_category_api']=(health or {}).get('dedicated_tax_category_api') if isinstance(health,dict) else None
          out['verified']=(out.get('hub_app_has_release') is True and actual==EXPECTED and release==RELEASE_ID and out['tax_category_supported'] is True and out['dedicated_tax_category_api'] is True and '/tax_category_api' in api_names)
          Path('tax-ai-v1/hf-space-sync.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['verified']: raise RuntimeError(f'V1.5.2 release contract did not become live: version={actual}, release={release}, apis={api_names}')
          PY
      - name: Commit deployment status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space-sync.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record ZeroGPU V1.5.2 release verification'
            git push origin HEAD:gh-pages
          fi
