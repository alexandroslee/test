# Trigger 2026-08-22 15:40 +08: FORCE rerun sync and VERIFY real V1.5.1 backend.
name: Sync Tax AI ZeroGPU Space

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-tax-ai-hf-space.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: python -m pip install --upgrade 'huggingface_hub>=0.35' requests
      - name: Upload latest Space code, wait, and verify exact backend version
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from pathlib import Path
          from huggingface_hub import HfApi

          EXPECTED='1.5.1'
          repo_id='AlexandrosLee/tax-ai-zerogpu'
          base='https://alexandroslee-tax-ai-zerogpu.hf.space'
          token=os.environ['HF_TOKEN']
          headers={'Authorization':'Bearer '+token}
          api=HfApi(token=token)
          commit=api.upload_folder(folder_path='hf-space-tax-ai',repo_id=repo_id,repo_type='space',commit_message='V1.5.1: dedicated cropped tax-category Vision API')
          out={'repo_id':repo_id,'space_url':base,'uploaded':True,'commit':str(commit),'started_at_unix':int(time.time()),'expected_backend_version':EXPECTED}
          try: api.wait_for_space(repo_id=repo_id,timeout=1200)
          except Exception as e: out['wait_warning']=repr(e)
          rt=api.get_space_runtime(repo_id=repo_id);out['stage']=str(rt.stage);out['hardware']=str(rt.hardware) if rt.hardware else None
          r=requests.get(base+'/gradio_api/info',headers=headers,timeout=60);out['info_http']=r.status_code;out['api_names']=[k for k in (r.json().get('named_endpoints') or {}).keys()] if r.ok else []
          health=None; health_error=None
          try:
              s=requests.post(base+'/gradio_api/call/health_api',headers={**headers,'Content-Type':'application/json'},json={'data':['health']},timeout=60);out['health_submit_http']=s.status_code;s.raise_for_status();eid=s.json()['event_id']
              g=requests.get(base+f'/gradio_api/call/health_api/{eid}',headers=headers,timeout=120);out['health_result_http']=g.status_code;g.raise_for_status();last=None
              for line in g.text.splitlines():
                  if line.startswith('data:'):
                      try:
                          x=json.loads(line[5:].strip())
                          if isinstance(x,list) and x:last=x[0]
                      except Exception:pass
              health=last
          except Exception as e:health_error=repr(e)
          out['health']=health
          if health_error:out['health_error']=health_error
          actual=(health or {}).get('backend_version') if isinstance(health,dict) else None
          out['actual_backend_version']=actual
          out['tax_category_supported']=(health or {}).get('tax_category_supported') if isinstance(health,dict) else None
          out['dedicated_tax_category_api']=(health or {}).get('dedicated_tax_category_api') if isinstance(health,dict) else None
          out['verified']=actual==EXPECTED and out['tax_category_supported'] is True and out['dedicated_tax_category_api'] is True and '/tax_category_api' in out['api_names']
          Path('tax-ai-v1/hf-space-sync.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['verified']:raise RuntimeError(f'Backend mismatch: expected {EXPECTED}, got {actual}, dedicated={out["dedicated_tax_category_api"]}, apis={out["api_names"]}')
          PY
      - name: Commit verified sync status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space-sync.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified ZeroGPU backend V1.5.1'
            git push origin HEAD:gh-pages
          fi
