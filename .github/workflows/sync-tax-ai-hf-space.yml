# Trigger 2026-08-22: sync official Gemma 4 multimodal OCR path.
name: Sync Tax AI ZeroGPU Space

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-tax-ai-hf-space.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: python -m pip install --upgrade 'huggingface_hub>=0.35' requests
      - name: Upload latest Space code and wait
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from pathlib import Path
          from huggingface_hub import HfApi
          repo_id='AlexandrosLee/tax-ai-zerogpu'
          base='https://alexandroslee-tax-ai-zerogpu.hf.space'
          api=HfApi(token=os.environ['HF_TOKEN'])
          commit=api.upload_folder(folder_path='hf-space-tax-ai',repo_id=repo_id,repo_type='space',commit_message='Fix Gemma 4 official multimodal OCR path')
          out={'repo_id':repo_id,'space_url':base,'uploaded':True,'commit':str(commit),'started_at_unix':int(time.time())}
          try:
              api.wait_for_space(repo_id=repo_id,timeout=1200)
          except Exception as e: out['wait_warning']=repr(e)
          rt=api.get_space_runtime(repo_id=repo_id)
          out['stage']=str(rt.stage);out['hardware']=str(rt.hardware) if rt.hardware else None
          try:
              r=requests.get(base+'/gradio_api/info',headers={'Authorization':'Bearer '+os.environ['HF_TOKEN']},timeout=60)
              out['info_http']=r.status_code
              out['api_names']=[k for k in (r.json().get('named_endpoints') or {}).keys()] if r.ok else []
          except Exception as e: out['info_error']=repr(e)
          Path('tax-ai-v1/hf-space-sync.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit sync status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space-sync.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record ZeroGPU Space sync status'
            git push origin HEAD:gh-pages
          fi
