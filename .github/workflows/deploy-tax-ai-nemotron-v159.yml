name: Deploy Tax AI V1.5.9 Nemotron Parse 2.0

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-tax-ai-nemotron-v159.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: python -m pip install --upgrade 'huggingface_hub>=1.5.0' requests
      - name: Create and deploy V1.5.9 Nemotron Parse ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from pathlib import Path
          from huggingface_hub import HfApi
          EXPECTED='1.5.9'
          RELEASE_ID='tax-ai-1.5.9-nemotron-parse-20260830-r2'
          MODEL='nvidia/NVIDIA-Nemotron-Parse-2.0'
          repo_id='AlexandrosLee/tax-ai-nemotron-v159'
          base='https://alexandroslee-tax-ai-nemotron-v159.hf.space'
          token=os.environ['HF_TOKEN']; headers={'Authorization':'Bearer '+token}; api=HfApi(token=token)
          api.create_repo(repo_id=repo_id,repo_type='space',space_sdk='gradio',space_hardware='zero-a10g',exist_ok=True,private=False)
          commit=api.upload_folder(folder_path='hf-space-tax-ai-v159',repo_id=repo_id,repo_type='space',commit_message=f'V{EXPECTED} Nemotron Parse 2.0: {RELEASE_ID}')
          out={'repo_id':repo_id,'space_url':base,'repo_url':'https://huggingface.co/spaces/'+repo_id,'commit':str(commit),'expected_backend_version':EXPECTED,'expected_release_id':RELEASE_ID,'model':MODEL,'started_at_unix':int(time.time())}
          health=None;api_names=[];probes=[]
          for attempt in range(180):
              p={'attempt':attempt+1,'unix':int(time.time())}
              try:
                  rt=api.get_space_runtime(repo_id=repo_id);p['stage']=str(rt.stage);p['hardware']=str(rt.hardware) if rt.hardware else None;p['requested_hardware']=str(rt.requested_hardware) if rt.requested_hardware else None
              except Exception as e:p['runtime_error']=repr(e)
              try:
                  r=requests.get(base+'/gradio_api/info',headers=headers,timeout=30);p['info_http']=r.status_code
                  if r.ok:api_names=list((r.json().get('named_endpoints') or {}).keys());p['api_names']=api_names
              except Exception as e:p['info_error']=repr(e)
              try:
                  s=requests.post(base+'/gradio_api/call/health_api',headers={**headers,'Content-Type':'application/json'},json={'data':['health']},timeout=30);p['health_submit_http']=s.status_code
                  if s.ok and s.json().get('event_id'):
                      eid=s.json()['event_id'];g=requests.get(base+f'/gradio_api/call/health_api/{eid}',headers=headers,timeout=90);p['health_result_http']=g.status_code
                      if g.ok:
                          last=None
                          for line in g.text.splitlines():
                              if line.startswith('data:'):
                                  try:
                                      x=json.loads(line[5:].strip())
                                      if isinstance(x,list) and x:last=x[0]
                                  except Exception:pass
                          health=last
                          if isinstance(last,dict):p['backend_version']=last.get('backend_version');p['release_id']=last.get('release_id');p['model']=last.get('model')
              except Exception as e:p['health_error']=repr(e)
              probes.append(p)
              if len(probes)>20:probes=probes[-20:]
              ok=isinstance(health,dict) and health.get('backend_version')==EXPECTED and health.get('release_id')==RELEASE_ID and health.get('model')==MODEL and '/invoice_api' in api_names and '/parse_api' in api_names
              if ok:break
              time.sleep(6)
          out['health']=health;out['api_names']=api_names;out['last_probes']=probes;out['verified']=bool(isinstance(health,dict) and health.get('backend_version')==EXPECTED and health.get('release_id')==RELEASE_ID and health.get('model')==MODEL and '/invoice_api' in api_names and '/parse_api' in api_names)
          Path('tax-ai-v1/hf-space-v159.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['verified']:raise RuntimeError(f'Nemotron Space did not verify: {health}, apis={api_names}')
          PY
      - name: Commit V1.5.9 Space verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-ai-v1/hf-space-v159.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Nemotron Parse V1.5.9 ZeroGPU verification'
            git push origin HEAD:gh-pages
          fi
