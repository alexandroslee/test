<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 超簡易營業稅申報 V0.36｜V0.35介面＋8格透視拉正</title>
<style>
html,body{margin:0;background:#f4f7fb;font-family:"Microsoft JhengHei",system-ui,sans-serif}
#app{display:block;width:100%;border:0;min-height:3600px;background:#f4f7fb}
.loading{max-width:900px;margin:30px auto;padding:18px;background:#fff;border-radius:16px;border:1px solid #e2e8f0;color:#334155;font-weight:700}
</style>
</head>
<body>
<div id="loading" class="loading">正在載入 V0.36：維持 V0.35 介面，追加「買受人統編 8 格透視拉正」功能。</div>
<iframe id="app" src="../tax-ai-v034/" title="AI 超簡易營業稅申報 V0.36"></iframe>
<script>
const frame=document.getElementById('app'),loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const loadScript=(src)=>new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)});
    (async()=>{
      await loadScript('../tax-ai-v035/layout-v035.js?build=20260816-2');
      await loadScript('../tax-ai-v036/perspective-v036.js?build=20260816-2');
      loading.style.display='none';
      const resize=()=>{try{frame.style.height=Math.max(3600,d.documentElement.scrollHeight+80)+'px'}catch{}};
      resize();
      new ResizeObserver(resize).observe(d.documentElement);
      setInterval(resize,1200);
    })().catch(e=>{loading.textContent='V0.36 載入失敗：'+e.message});
  }catch(e){loading.textContent='V0.36 載入失敗：'+e.message}
});
</script>
</body>
</html>
