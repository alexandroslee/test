<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 超簡易營業稅申報 v0.3｜申報單位＋QR＋OCR</title><style>:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1220px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#fff3df;color:#9a4b00;padding:8px 12px;border-radius:999px;font-weight:800}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 8px 24px #0f172a12}.muted{color:#64748b}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}.field{display:grid;gap:6px}.field input,.field select{padding:10px;border:1px solid #d8e0ea;border-radius:10px;font:inherit;background:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#155eef;color:#fff}.ghost{background:#f8fafc;color:#334155;border:1px solid #dbe4ef}.ok{background:#ecfdf3;color:#067647;padding:9px 11px;border-radius:10px;font-weight:800}.warn{background:#fff7ed;color:#b54708;padding:9px 11px;border-radius:10px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.sum{background:#f8fafc;border:1px solid #e5ebf2;border-radius:12px;padding:11px}.sum b{display:block;margin-top:5px;word-break:break-word}.frame{width:100%;height:1800px;border:0;border-radius:18px;background:#fff;margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-title h2{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.frame{height:2100px}}@media(max-width:540px){.wrap{padding:10px}.top{display:block}.tag{display:inline-block;margin-top:8px}.form{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr}.frame{height:2600px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">AI 超簡易營業稅申報</h1><div class="muted">V0.3｜申報單位基本資料＋QR／條碼／OCR</div></div><div class="tag">DEMO｜不會實際申報</div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><h2>🏢 0. 申報單位基本資料</h2><div class="muted">依營業稅申報所需的營業人、申報期別與聯絡資訊建立一次，後續每期自動帶入。</div></div><div class="actions"><button id="save" class="btn primary">儲存基本資料</button><button id="clear" class="btn ghost">清除</button></div></div><div class="form"><div class="field"><label>營業人／公司名稱 *</label><input id="companyName" placeholder="例如：○○有限公司"></div><div class="field"><label>統一編號（8碼）*</label><input id="companyBan" maxlength="8" inputmode="numeric" placeholder="12345678"></div><div class="field"><label>稅籍編號（9碼）</label><input id="taxRegistry" maxlength="9" inputmode="numeric" placeholder="稅籍編號"></div><div class="field"><label>負責人姓名</label><input id="responsiblePerson" placeholder="負責人"></div><div class="field"><label>縣市別</label><select id="cityCode"><option value="">請選擇</option><option value="A">A 臺北市</option><option value="F">F 新北市</option><option value="H">H 桃園市</option><option value="O">O 新竹市</option><option value="B">B 臺中市</option><option value="D">D 臺南市</option><option value="E">E 高雄市</option><option value="J">J 新竹縣</option><option value="K">K 苗栗縣</option><option value="M">M 南投縣</option><option value="N">N 彰化縣</option><option value="P">P 雲林縣</option><option value="Q">Q 嘉義縣</option><option value="I">I 嘉義市</option><option value="T">T 屏東縣</option><option value="G">G 宜蘭縣</option><option value="U">U 花蓮縣</option><option value="V">V 臺東縣</option><option value="C">C 基隆市</option><option value="X">X 澎湖縣</option><option value="W">W 金門縣</option><option value="Z">Z 連江縣</option></select></div><div class="field"><label>申報書</label><input value="401 一般稅額計算" readonly></div><div class="field full"><label>營業地址</label><input id="businessAddress" placeholder="營業登記地址"></div><div class="field"><label>申報方式</label><select id="filingMode"><option value="period">按期申報（每2個月）</option><option value="month">按月申報</option></select></div><div class="field"><label>本期起日</label><input id="periodStart" type="date" value="2026-07-01"></div><div class="field"><label>本期迄日</label><input id="periodEnd" type="date" value="2026-08-31"></div><div class="field"><label>上期累積留抵【108】</label><input id="openingCredit" type="number" min="0" value="2000"></div><div class="field"><label>申報身分</label><select id="declarantType"><option value="self">自行申報</option><option value="agent">委任代理申報</option></select></div><div class="field"><label>申報人／代理人姓名</label><input id="declarantName" placeholder="姓名"></div><div class="field"><label>聯絡電話</label><input id="phone" placeholder="02-12345678"></div><div class="field"><label>傳真</label><input id="fax" placeholder="可留空"></div><div class="field"><label>總機構彙總／合併申報</label><select id="consolidated"><option value="no">否（MVP 預設）</option><option value="yes">是／已核准</option></select></div><div class="field"><label>備註</label><input id="companyNote" placeholder="測試用備註"></div></div><div id="saveMsg" class="warn" style="margin-top:14px">尚未儲存。此 DEMO 僅存於本機瀏覽器 LocalStorage。</div><div class="summary"><div class="sum"><span class="muted">申報單位</span><b id="sumName">—</b></div><div class="sum"><span class="muted">統一編號</span><b id="sumBan">—</b></div><div class="sum"><span class="muted">稅籍編號</span><b id="sumTax">—</b></div><div class="sum"><span class="muted">本期</span><b id="sumPeriod">2026-07-01 ～ 2026-08-31</b></div></div></div><iframe id="app" class="frame" src="tax-ai-ocr-v03.html" title="V0.3 QR OCR 報稅雛型"></iframe></div><script>const $=id=>document.getElementById(id),KEY='taxAiV03CompanyProfile',ids=['companyName','companyBan','taxRegistry','responsiblePerson','cityCode','businessAddress','filingMode','periodStart','periodEnd','openingCredit','declarantType','declarantName','phone','fax','consolidated','companyNote'];function data(){const o={};ids.forEach(id=>o[id]=$(id).value.trim());return o}function valid(o){if(!o.companyName)return'請輸入營業人／公司名稱';if(!/^\d{8}$/.test(o.companyBan))return'統一編號必須為 8 碼數字';if(o.taxRegistry&&!/^\d{9}$/.test(o.taxRegistry))return'稅籍編號如有填寫，須為 9 碼數字';return''}function render(o){sumName.textContent=o.companyName||'—';sumBan.textContent=o.companyBan||'—';sumTax.textContent=o.taxRegistry||'—';sumPeriod.textContent=(o.periodStart||'—')+' ～ '+(o.periodEnd||'—')}function sync(){const o=data(),w=app.contentWindow;if(!w)return;try{const ban=w.document.getElementById('companyBan'),credit=w.document.getElementById('credit');if(ban)ban.value=o.companyBan||'';if(credit){credit.value=o.openingCredit||0;credit.dispatchEvent(new Event('input',{bubbles:true}))}}catch(e){}}function saveProfile(){const o=data(),err=valid(o);if(err){saveMsg.className='warn';saveMsg.textContent='⚠ '+err;return false}localStorage.setItem(KEY,JSON.stringify(o));render(o);sync();saveMsg.className='ok';saveMsg.textContent='✓ 申報單位基本資料已儲存，並同步到下方 V0.3 Agent。';return true}save.onclick=saveProfile;clear.onclick=()=>{if(!confirm('清除申報單位基本資料？'))return;localStorage.removeItem(KEY);ids.forEach(id=>{if(!['periodStart','periodEnd','openingCredit'].includes(id))$(id).value=''});openingCredit.value=2000;periodStart.value='2026-07-01';periodEnd.value='2026-08-31';render(data());sync();saveMsg.className='warn';saveMsg.textContent='已清除。'};app.onload=sync;try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){ids.forEach(id=>{if(o[id]!==undefined&&$(id))$(id).value=o[id]});render(o);saveMsg.className='ok';saveMsg.textContent='✓ 已載入上次儲存的申報單位基本資料。'}else render(data())}catch(e){render(data())}</script></body></html>
