<iframe id="app" src="../tax-ai-v034/?build=20260817-1" title="AI 超簡易營業稅申報 V0.37.2"></iframe>
<script>
const frame=document.getElementById('app'),loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const loadScript=(src)=>new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)});
    (async()=>{
      await loadScript('../tax-ai-v035/layout-v035.js?build=20260817-1');
      await loadScript('../tax-ai-v036/perspective-v036.js?build=20260817-1');
      await loadScript('../tax-ai-v037/digit-v037.js?build=20260817-1');
      await loadScript('../tax-ai-v037/buyer-verify-v0372.js?build=20260817-1');
      loading.style.display='none';
      const resize=()=>{try{frame.style.height=Math.max(4600,d.documentElement.scrollHeight+100)+'px'}catch{}};
      resize();new ResizeObserver(resize).observe(d.documentElement);setInterval(resize,1200);
    })().catch(e=>{loading.textContent='V0.37.2 載入失敗：'+e.message});
  }catch(e){loading.textContent='V0.37.2 載入失敗：'+e.message}
});
</script>
